name = "booking-meo"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 위젯 파일(widget.js, 마스코트, 시험 페이지)을 같은 주소에서 내보낸다
[assets]
directory = "../widget"

# 사장님 Cloudflare 계정의 Workers AI (무료 할당량 안에서 동작)
[ai]
binding = "AI"

# 대화 임시 보관: 대화가 멈추면 사장님 메일로 보내고 지운다
[[durable_objects.bindings]]
name = "SESSION"
class_name = "Session"

# 하루 AI 사용량 상한
[[durable_objects.bindings]]
name = "USAGE"
class_name = "Usage"

# 문의함: 알림이 없어도 문의를 보관 (기본 30일)
[[durable_objects.bindings]]
name = "INBOX"
class_name = "Inbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Session", "Usage"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Inbox"]

# store/store.md 를 글자 그대로 불러온다
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# 접속자 한 명당 1분에 20번까지
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[vars]
STORE_NAME = "모락 베이커리"
# 네이버 예약 주소. 비우면 예약 버튼을 보내지 않는다
BOOKING_URL = ""
# 챗봇을 붙일 홈페이지 주소. 쉼표로 여러 개. 비우면 어디서나 호출 가능
ALLOWED_ORIGINS = ""
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# 하루 AI 답변 상한. 넘으면 문의 남기기로 안내한다
DAILY_AI_LIMIT = "300"
# 대화가 이 시간(분) 동안 멈추면 사장님 메일로 대화 기록을 보낸다
IDLE_MINUTES = "30"
# 문의함 보관 일수
INBOX_DAYS = "30"
# 메일 보내는 주소. Gmail API 로 보내면 그 Google 계정 주소(또는 등록한 별칭)여야 한다
MAIL_FROM = "부킹냥 <onboarding@resend.dev>"
# 개인정보 처리방침 주소. 적으면 카카오·톡톡 동의 안내에 링크를 붙인다 (위젯은 data-privacy)
PRIVACY_URL = ""
MOCK = "0"
